services:
  db:
    image: postgres:16-alpine
    container_name: finflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-finflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finflow} -d ${POSTGRES_DB:-finflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finflow_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      PROJECT_NAME: "${PROJECT_NAME:-FinFlow API}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-finflow}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-finflow_db}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-change-this-in-production-min-32-chars}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8000}"
      DEFAULT_CURRENCY_SYMBOL: "${DEFAULT_CURRENCY_SYMBOL:-k-Toman}"
    ports:
      - "8000:8000"
    networks:
      - finflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finflow_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    networks:
      - finflow_network

volumes:
  postgres_data:
    driver: local

networks:
  finflow_network:
    driver: bridge
